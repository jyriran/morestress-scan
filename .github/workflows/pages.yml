name: Build, test and publish the scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries for canvas
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Get the image-tracking compiler (mind-ar 1.2.5)
        run: |
          git clone --depth 1 --branch v1.2.5 https://github.com/hiukim/mind-ar-js.git "$RUNNER_TEMP/mind-ar-js"
          cd "$RUNNER_TEMP/mind-ar-js"
          npm install --no-audit --no-fund

      - name: Compile designs into targets.mind
        env:
          MINDAR_DIR: ${{ runner.temp }}/mind-ar-js
        run: node tools/compile-targets.mjs .

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r designs _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
          ls -la _site _site/designs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Plays the real shirt video into headless Chrome as the camera and checks
  # the page locks onto the print. Screenshots land in the "scan-test" artifact.
  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make the fake camera feed
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -loglevel error -y -stream_loop 2 -i tests/shirt-scan.mp4 -vf "scale=540:960,fps=30" -pix_fmt yuv420p -t 20 "$RUNNER_TEMP/cam.y4m"
          ls -la "$RUNNER_TEMP/cam.y4m"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Run the scan
        env:
          CAM: ${{ runner.temp }}/cam.y4m
          SITE: _site
        run: node tests/scan-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-test
          path: test-output/

      # Also keep the latest screenshots on the scan-test-results branch so
      # they can be looked at without downloading the artifact.
      - name: Save screenshots to the scan-test-results branch
        if: always()
        run: |
          cd test-output
          git init -q -b scan-test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Scan test for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" scan-test-results

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
